<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.6"/>
  <text x="5" y="13" font-family="monospace" font-size="8" font-weight="bold" fill="#00ff9d" filter="url(#glow)">&gt;_</text>
  <text x="5" y="22" font-family="monospace" font-size="5" fill="#ff00ff" opacity="0.9">OK</text>
  <rect x="5" y="25" width="10" height="1" rx="0.5" fill="#00ff9d" opacity="0.4"/>
  <rect x="5" y="27" width="16" height="1" rx="0.5" fill="#ff00ff" opacity="0.25"/>
</svg>
